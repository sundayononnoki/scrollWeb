<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loop Text Screen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23101010'/%3E%3Cpath d='M12 32h40M36 18l14 14-14 14' fill='none' stroke='%23f7f7ef' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --text-color: #f7f7ef;
      --bg-color: #101010;
      --font-family: "Helvetica Neue", "PingFang SC", sans-serif;
      --font-weight: 800;
      --duration: 12s;
      --text-size: 96px;
      --marquee-distance: 0px;
      --blink-duration: 0.9s;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #e8e5dc;
      color: #181818;
      font-family: "Helvetica Neue", "PingFang SC", sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: minmax(260px, 50vh) auto;
    }

    .preview-panel {
      min-height: 0;
      padding: clamp(16px, 3vw, 32px);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 35%),
        var(--bg-color);
      border-bottom: 1px solid rgba(0, 0, 0, 0.18);
    }

    .preview-frame {
      position: relative;
      height: 100%;
      min-height: 220px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: var(--bg-color);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
    }

    .controls-panel {
      min-height: 50vh;
      overflow: visible;
      padding: clamp(22px, 4vw, 44px);
      background: #efede5;
    }

    .controls {
      min-height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 28px clamp(28px, 5vw, 56px);
      align-content: start;
      align-items: start;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 106px;
    }

    .field label:not(.switch),
    .switch span {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0;
      color: #444039;
    }

    .field > label:not(.switch) {
      display: flex;
      align-items: flex-end;
      min-height: 24px;
      line-height: 1.2;
    }

    textarea,
    select,
    .color-field,
    .range-field,
    .switch {
      width: 100%;
      border: 1px solid #cfc8b8;
      background: #fbfaf5;
      color: #181818;
      border-radius: 8px;
      min-height: 72px;
    }

    select {
      padding: 0 14px;
      outline: none;
    }

    textarea {
      height: 72px;
      min-height: 72px;
      padding: 12px 14px;
      outline: none;
      resize: vertical;
      line-height: 1.45;
    }

    textarea:focus,
    select:focus,
    .switch:focus-within {
      border-color: #1a1a1a;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
    }

    .text-field {
      grid-row: auto;
      min-height: 106px;
    }

    .color-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px 8px 14px;
    }

    input[type="color"] {
      width: 42px;
      height: 32px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .range-field {
      display: grid;
      gap: 8px;
      min-height: 72px;
      padding: 10px 14px;
      align-content: center;
    }

    .range-field__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .range-field__head span {
      color: #6a6257;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .range-value {
      color: #181818;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #101010;
      cursor: pointer;
    }

    .switch {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 14px;
      cursor: pointer;
      user-select: none;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch i {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: #c9c1b1;
      padding: 3px;
      transition: background 160ms ease;
    }

    .switch i::before {
      content: "";
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fbfaf5;
      transition: transform 160ms ease;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
    }

    .switch input:checked + i {
      background: #101010;
    }

    .switch input:checked + i::before {
      transform: translateX(20px);
    }

    .option-field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 106px;
    }

    .option-field > .switch {
      flex: 0 0 72px;
      height: 72px;
      min-height: 72px;
      max-height: 72px;
      align-items: center;
    }

    .option-panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 14px;
      border: 1px solid #cfc8b8;
      border-radius: 8px;
      background: #fbfaf5;
    }

    .option-panel[hidden] {
      display: none;
    }

    .option-panel .range-field {
      min-height: 72px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .option-panel .field {
      gap: 8px;
      min-height: 100px;
    }

    .option-panel .field > label {
      min-height: 20px;
    }

    .start-button {
      grid-column: span 2;
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      background: #101010;
      color: #fffdf6;
      font-weight: 900;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    .start-button:hover {
      background: #2a2925;
      transform: translateY(-1px);
    }

    .marquee {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      background: var(--bg-color);
    }

    .marquee__track {
      display: flex;
      width: max-content;
      color: var(--text-color);
      font-family: var(--font-family);
      font-weight: var(--font-weight);
      line-height: 1;
      white-space: pre;
      will-change: transform;
      animation-duration: var(--duration);
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .marquee__group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
    }

    .marquee__item {
      display: inline-block;
      padding-inline: 0.75em;
    }

    .marquee.is-static .marquee__track {
      animation: none;
    }

    .marquee.is-blinking .marquee__item {
      animation: blink var(--blink-duration) steps(2, jump-none) infinite;
    }

    .marquee.is-static {
      align-items: center;
      justify-content: center;
    }

    .marquee.is-static .marquee__group + .marquee__group {
      display: none;
    }

    .marquee[data-direction="left"],
    .marquee[data-direction="right"] {
      align-items: center;
      justify-content: flex-start;
    }

    .marquee[data-direction="up"],
    .marquee[data-direction="down"] {
      align-items: flex-start;
      justify-content: center;
    }

    .marquee.is-static[data-direction] {
      align-items: center;
      justify-content: center;
    }

    .marquee.is-static .marquee__track {
      transform: none;
    }

    .preview-frame .marquee__track {
      font-size: var(--text-size);
    }

    .stage .marquee__track {
      font-size: var(--text-size);
    }

    .marquee[data-direction="left"] .marquee__track {
      animation-name: move-left;
    }

    .marquee[data-direction="right"] .marquee__track {
      animation-name: move-right;
    }

    .marquee[data-direction="up"] .marquee__track,
    .marquee[data-direction="down"] .marquee__track {
      flex-direction: column;
      width: auto;
    }

    .marquee[data-direction="up"] .marquee__group,
    .marquee[data-direction="down"] .marquee__group {
      flex-direction: column;
      align-items: center;
    }

    .marquee[data-direction="up"] .marquee__item,
    .marquee[data-direction="down"] .marquee__item {
      padding: 0.28em 0;
    }

    .marquee[data-direction="up"] .marquee__track {
      animation-name: move-up;
    }

    .marquee[data-direction="down"] .marquee__track {
      animation-name: move-down;
    }

    @keyframes move-left {
      from { transform: translateX(0); }
      to { transform: translateX(calc(-1 * var(--marquee-distance))); }
    }

    @keyframes move-right {
      from { transform: translateX(calc(-1 * var(--marquee-distance))); }
      to { transform: translateX(0); }
    }

    @keyframes move-up {
      from { transform: translateY(0); }
      to { transform: translateY(calc(-1 * var(--marquee-distance))); }
    }

    @keyframes move-down {
      from { transform: translateY(calc(-1 * var(--marquee-distance))); }
      to { transform: translateY(0); }
    }

    @keyframes blink {
      0%, 52% { opacity: 1; }
      53%, 100% { opacity: 0; }
    }

    .stage {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: var(--bg-color);
      cursor: pointer;
      touch-action: manipulation;
    }

    .stage.is-active {
      display: block;
    }

    @media (orientation: portrait) and (max-width: 820px) {
      .stage.is-active {
        width: 100vh;
        height: 100vw;
        transform: rotate(90deg) translateY(-100%);
        transform-origin: top left;
      }
    }

    @media (max-width: 900px) {
      .app {
        grid-template-rows: minmax(240px, 46vh) auto;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
        align-content: start;
      }

      .text-field,
      .start-button {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 560px) {
      .app {
        min-height: 100svh;
        grid-template-rows: 42svh auto;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .option-panel {
        grid-template-columns: 1fr;
      }

      .preview-frame {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="home">
    <section class="preview-panel" aria-label="滚动效果预览">
      <div class="preview-frame">
        <div class="marquee" id="previewMarquee" data-direction="left">
          <div class="marquee__track" id="previewTrack"></div>
        </div>
      </div>
    </section>

    <section class="controls-panel" aria-label="文本与播放设置">
      <form class="controls" id="controls">
        <div class="field text-field">
          <label for="message">文本</label>
          <textarea id="message" rows="5">欢迎光临</textarea>
        </div>

        <div class="field">
          <label for="textColor">文本颜色</label>
          <div class="color-field">
            <span id="textColorValue">#F7F7EF</span>
            <input id="textColor" type="color" value="#f7f7ef">
          </div>
        </div>

        <div class="field">
          <label for="bgColor">背景颜色</label>
          <div class="color-field">
            <span id="bgColorValue">#101010</span>
            <input id="bgColor" type="color" value="#101010">
          </div>
        </div>

        <div class="field">
          <label for="fontFamily">字体</label>
          <select id="fontFamily">
            <option value='"Helvetica Neue", "PingFang SC", sans-serif'>现代黑体</option>
            <option value='Georgia, "Times New Roman", serif'>衬线字体</option>
            <option value='"Courier New", monospace'>等宽字体</option>
            <option value='Kaiti, "KaiTi", "STKaiti", serif'>楷体</option>
            <option value='"Arial Black", Impact, sans-serif'>粗标题</option>
          </select>
        </div>

        <div class="field">
          <label for="textSize">文字大小</label>
          <div class="range-field">
            <div class="range-field__head">
              <span>Size</span>
              <strong class="range-value" id="textSizeValue">96px</strong>
            </div>
            <input id="textSize" type="range" min="32" step="1" value="96">
          </div>
        </div>

        <div class="field">
          <label for="fontWeight">字体粗细</label>
          <div class="range-field">
            <div class="range-field__head">
              <span>Weight</span>
              <strong class="range-value" id="fontWeightValue">800</strong>
            </div>
            <input id="fontWeight" type="range" min="300" max="900" step="100" value="800">
          </div>
        </div>

        <div class="field option-field">
          <label for="blink">文本闪动</label>
          <label class="switch">
            <span>启用</span>
            <input id="blink" type="checkbox">
            <i aria-hidden="true"></i>
          </label>

          <div class="option-panel" id="blinkOptions" hidden>
            <div class="field">
              <label for="blinkFrequency">闪动频率</label>
              <div class="range-field">
                <div class="range-field__head">
                  <span>Frequency</span>
                  <strong class="range-value" id="blinkFrequencyValue">5</strong>
                </div>
                <input id="blinkFrequency" type="range" min="1" max="10" step="1" value="5">
              </div>
            </div>
          </div>
        </div>

        <div class="field option-field">
          <label for="loop">是否滚动</label>
          <label class="switch">
            <span>启用</span>
            <input id="loop" type="checkbox" checked>
            <i aria-hidden="true"></i>
          </label>

          <div class="option-panel" id="loopOptions">
            <div class="field">
              <label for="direction">循环方向</label>
              <select id="direction">
                <option value="left">向左</option>
                <option value="right">向右</option>
                <option value="up">向上</option>
                <option value="down">向下</option>
              </select>
            </div>

            <div class="field">
              <label for="scrollSpeed">滚动速度</label>
              <div class="range-field">
                <div class="range-field__head">
                  <span>Speed</span>
                  <strong class="range-value" id="scrollSpeedValue">5</strong>
                </div>
                <input id="scrollSpeed" type="range" min="1" max="10" step="1" value="5">
              </div>
            </div>
          </div>
        </div>

        <button class="start-button" type="button" id="startButton">启动</button>
      </form>
    </section>
  </main>

  <section class="stage" id="stage" aria-label="全屏循环文本">
    <div class="marquee" id="stageMarquee" data-direction="left">
      <div class="marquee__track" id="stageTrack"></div>
    </div>
  </section>

  <script>
    const controls = {
      message: document.querySelector("#message"),
      textColor: document.querySelector("#textColor"),
      bgColor: document.querySelector("#bgColor"),
      fontFamily: document.querySelector("#fontFamily"),
      textSize: document.querySelector("#textSize"),
      fontWeight: document.querySelector("#fontWeight"),
      scrollSpeed: document.querySelector("#scrollSpeed"),
      direction: document.querySelector("#direction"),
      blink: document.querySelector("#blink"),
      blinkFrequency: document.querySelector("#blinkFrequency"),
      loop: document.querySelector("#loop")
    };

    const previewMarquee = document.querySelector("#previewMarquee");
    const previewTrack = document.querySelector("#previewTrack");
    const stage = document.querySelector("#stage");
    const stageMarquee = document.querySelector("#stageMarquee");
    const stageTrack = document.querySelector("#stageTrack");
    const textColorValue = document.querySelector("#textColorValue");
    const bgColorValue = document.querySelector("#bgColorValue");
    const textSizeValue = document.querySelector("#textSizeValue");
    const fontWeightValue = document.querySelector("#fontWeightValue");
    const scrollSpeedValue = document.querySelector("#scrollSpeedValue");
    const blinkFrequencyValue = document.querySelector("#blinkFrequencyValue");
    const blinkOptions = document.querySelector("#blinkOptions");
    const loopOptions = document.querySelector("#loopOptions");
    const startButton = document.querySelector("#startButton");
    let resizeFrame = 0;

    function getMaxTextSize() {
      return Math.max(32, Math.floor(window.innerHeight * 0.9));
    }

    function syncTextSizeLimit() {
      const maxTextSize = getMaxTextSize();
      controls.textSize.max = String(maxTextSize);

      if (Number(controls.textSize.value) > maxTextSize) {
        controls.textSize.value = String(maxTextSize);
      }
    }

    function readOptions() {
      const scrollSpeed = Number(controls.scrollSpeed.value);
      const blinkFrequency = Number(controls.blinkFrequency.value);

      return {
        message: controls.message.value.trim() || " ",
        textColor: controls.textColor.value,
        bgColor: controls.bgColor.value,
        fontFamily: controls.fontFamily.value,
        textSize: Number(controls.textSize.value),
        fontWeight: controls.fontWeight.value,
        scrollSpeed,
        duration: 33 - scrollSpeed * 3,
        direction: controls.direction.value,
        blink: controls.blink.checked,
        blinkFrequency,
        blinkDuration: Number(((1.6 - blinkFrequency * 0.12) / 2).toFixed(2)),
        loop: controls.loop.checked
      };
    }

    function setCssOptions(options) {
      document.documentElement.style.setProperty("--text-color", options.textColor);
      document.documentElement.style.setProperty("--bg-color", options.bgColor);
      document.documentElement.style.setProperty("--font-family", options.fontFamily);
      document.documentElement.style.setProperty("--font-weight", options.fontWeight);
      document.documentElement.style.setProperty("--text-size", `${options.textSize}px`);
      document.documentElement.style.setProperty("--duration", `${options.duration}s`);
      document.documentElement.style.setProperty("--blink-duration", `${options.blinkDuration}s`);
      textColorValue.textContent = options.textColor.toUpperCase();
      bgColorValue.textContent = options.bgColor.toUpperCase();
      textSizeValue.textContent = `${options.textSize}px`;
      fontWeightValue.textContent = options.fontWeight;
      scrollSpeedValue.textContent = options.scrollSpeed;
      blinkFrequencyValue.textContent = options.blinkFrequency;
      blinkOptions.hidden = !options.blink;
      loopOptions.hidden = !options.loop;
    }

    function createItem(text) {
      const item = document.createElement("span");
      item.className = "marquee__item";
      item.textContent = text;
      return item;
    }

    function createGroup(text, count) {
      const group = document.createElement("div");
      group.className = "marquee__group";

      for (let index = 0; index < count; index += 1) {
        group.appendChild(createItem(text));
      }

      return group;
    }

    function fillTrack(marquee, track, text, loop, direction) {
      const isVertical = direction === "up" || direction === "down";
      track.replaceChildren();

      if (!loop) {
        track.style.setProperty("--marquee-distance", "0px");
        track.appendChild(createGroup(text, 1));
        return;
      }

      const measureGroup = createGroup(text, 1);
      track.appendChild(measureGroup);

      const containerLength = isVertical ? marquee.clientHeight : marquee.clientWidth;
      const itemLength = isVertical ? measureGroup.scrollHeight : measureGroup.scrollWidth;
      const safeItemLength = Math.max(itemLength, 1);
      const repeatCount = Math.max(2, Math.ceil(containerLength / safeItemLength) + 2);

      track.replaceChildren();
      const firstGroup = createGroup(text, repeatCount);
      const secondGroup = createGroup(text, repeatCount);
      track.append(firstGroup, secondGroup);

      const distance = isVertical ? firstGroup.scrollHeight : firstGroup.scrollWidth;
      track.style.setProperty("--marquee-distance", `${distance}px`);
    }

    function applyMarquee(marquee, track, options) {
      marquee.dataset.direction = options.direction;
      marquee.classList.toggle("is-blinking", options.blink);
      marquee.classList.toggle("is-static", !options.loop);
      fillTrack(marquee, track, options.message, options.loop, options.direction);

      track.style.animation = "none";
      track.offsetHeight;
      track.style.animation = "";
    }

    function render() {
      syncTextSizeLimit();
      const options = readOptions();
      setCssOptions(options);
      applyMarquee(previewMarquee, previewTrack, options);
      applyMarquee(stageMarquee, stageTrack, options);
    }

    async function enterPlayback() {
      stage.classList.add("is-active");
      render();

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.info("Fullscreen request was not accepted by this browser.");
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.info("Landscape lock is not available in this browser.");
      }
    }

    async function exitPlayback() {
      stage.classList.remove("is-active");

      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      } catch (error) {
        console.info("Orientation unlock is not available in this browser.");
      }

      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.info("Fullscreen exit was not accepted by this browser.");
      }
    }

    Object.values(controls).forEach((control) => {
      control.addEventListener("input", render);
      control.addEventListener("change", render);
    });

    window.addEventListener("resize", () => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(render);
    });

    startButton.addEventListener("click", enterPlayback);
    stage.addEventListener("click", exitPlayback);

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        stage.classList.remove("is-active");
      }
    });

    render();
  </script>
</body>
</html>
